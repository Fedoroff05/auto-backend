basePath: /api/v1
definitions:
  domain.CarBrand:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  domain.CarModel:
    properties:
      brand_id:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  domain.Chat:
    properties:
      buyer_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      listing_id:
        type: string
      seller_id:
        type: string
    type: object
  domain.Listing:
    properties:
      brand_id:
        type: integer
      brand_name:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/domain.ListingImage'
        type: array
      mileage:
        type: integer
      model_id:
        type: integer
      model_name:
        type: string
      price:
        type: number
      status:
        $ref: '#/definitions/domain.ListingStatus'
      updated_at:
        type: string
      user_id:
        type: string
      vin:
        type: string
      year:
        type: integer
    type: object
  domain.ListingImage:
    properties:
      created_at:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_main:
        type: boolean
      listing_id:
        type: string
    type: object
  domain.ListingStatus:
    enum:
    - draft
    - active
    - sold
    - banned
    type: string
    x-enum-varnames:
    - ListingStatusDraft
    - ListingStatusActive
    - ListingStatusSold
    - ListingStatusBanned
  domain.MarketValuationResult:
    properties:
      brand_id:
        type: integer
      estimated_price:
        type: number
      method:
        type: string
      model_id:
        type: integer
      sample_count:
        type: integer
      target_year:
        type: integer
    type: object
  domain.Message:
    properties:
      chat_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      sender_id:
        type: string
    type: object
  domain.Role:
    enum:
    - user
    - moderator
    - admin
    type: string
    x-enum-varnames:
    - RoleUser
    - RoleModerator
    - RoleAdmin
  domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/domain.Role'
      updated_at:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
      success:
        type: boolean
    type: object
  response.Response:
    properties:
      data: {}
      success:
        type: boolean
    type: object
  v1.authResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  v1.createListingRequest:
    properties:
      brand_id:
        type: integer
      description:
        type: string
      mileage:
        type: integer
      model_id:
        type: integer
      price:
        type: number
      vin:
        type: string
      year:
        type: integer
    type: object
  v1.listResponse:
    properties:
      listings:
        items:
          $ref: '#/definitions/domain.Listing'
        type: array
      total:
        type: integer
    type: object
  v1.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  v1.refreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  v1.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  v1.startChatRequest:
    properties:
      listing_id:
        type: string
    type: object
  v1.trackEventRequest:
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API для сервиса объявлений по продаже автомобилей.
  title: Auto Service Backend API
  version: "1.0"
paths:
  /ab/events:
    post:
      consumes:
      - application/json
      parameters:
      - description: Событие аналитики
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.trackEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
      summary: Залогировать аналитическое событие пользователя
      tags:
      - ab-testing
  /ab/variant:
    get:
      parameters:
      - description: Название эксперимента
        in: query
        name: experiment
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
      security:
      - BearerAuth: []
      summary: Получить вариант A/B теста для текущего пользователя
      tags:
      - ab-testing
  /auth/login:
    post:
      consumes:
      - application/json
      description: Аутентификация по email и паролю с получением пары JWT токенов
      parameters:
      - description: Учетные данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.authResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Вход в систему
      tags:
      - auth
  /auth/profile:
    get:
      description: Возвращает профиль аутентифицированного пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение профиля текущего пользователя
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Выпуск новой пары access/refresh токенов по действующему refresh
        токену
      parameters:
      - description: Refresh токен
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.authResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Обновление JWT токенов
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создает учетную запись пользователя с ролью user
      parameters:
      - description: Параметры регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Регистрация нового пользователя
      tags:
      - auth
  /brands:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.CarBrand'
                  type: array
              type: object
      summary: Список всех марок авто
      tags:
      - catalog
  /brands/{brand_id}/models:
    get:
      parameters:
      - description: ID марки
        in: path
        name: brand_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.CarModel'
                  type: array
              type: object
      summary: Список моделей марки
      tags:
      - catalog
  /chats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.Chat'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Список всех чатов пользователя
      tags:
      - chats
  /chats/{chat_id}/messages:
    get:
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      - description: Лимит
        in: query
        name: limit
        type: integer
      - description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.Message'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: История сообщений чата
      tags:
      - chats
  /chats/start:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID объявления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.startChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.Chat'
              type: object
      security:
      - BearerAuth: []
      summary: Создать или получить существующий чат по объявлению
      tags:
      - chats
  /favorites:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.Listing'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Получить список избранных авто пользователя
      tags:
      - favorites
  /favorites/{listing_id}:
    delete:
      parameters:
      - description: ID объявления
        in: path
        name: listing_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
      security:
      - BearerAuth: []
      summary: Удалить авто из избранного
      tags:
      - favorites
    post:
      parameters:
      - description: ID объявления
        in: path
        name: listing_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
      security:
      - BearerAuth: []
      summary: Добавить авто в избранное
      tags:
      - favorites
  /listings:
    get:
      parameters:
      - description: ID марки
        in: query
        name: brand_id
        type: integer
      - description: ID модели
        in: query
        name: model_id
        type: integer
      - description: Цена от
        in: query
        name: min_price
        type: number
      - description: Цена до
        in: query
        name: max_price
        type: number
      - description: Год от
        in: query
        name: min_year
        type: integer
      - description: Год до
        in: query
        name: max_year
        type: integer
      - description: Лимит на страницу
        in: query
        name: limit
        type: integer
      - description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.listResponse'
              type: object
      summary: Поиск по каталогу объявлений с фильтрами
      tags:
      - listings
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные авто
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.createListingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.Listing'
              type: object
      security:
      - BearerAuth: []
      summary: Создание объявления
      tags:
      - listings
  /listings/{id}:
    delete:
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
      security:
      - BearerAuth: []
      summary: Удаление объявления
      tags:
      - listings
    get:
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.Listing'
              type: object
      summary: Получение объявления по ID
      tags:
      - listings
    put:
      consumes:
      - application/json
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: string
      - description: Новые данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.createListingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.Listing'
              type: object
      security:
      - BearerAuth: []
      summary: Обновление объявления
      tags:
      - listings
  /listings/{id}/images:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: string
      - description: Файл картинки (jpg, png, webp)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.ListingImage'
              type: object
      security:
      - BearerAuth: []
      summary: Загрузка фотографии к объявлению
      tags:
      - listings
  /valuation/estimate:
    get:
      parameters:
      - description: ID марки
        in: query
        name: brand_id
        required: true
        type: integer
      - description: ID модели
        in: query
        name: model_id
        required: true
        type: integer
      - description: Год выпуска
        in: query
        name: year
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.MarketValuationResult'
              type: object
      summary: Оценка рыночной стоимости автомобиля
      tags:
      - valuation
securityDefinitions:
  BearerAuth:
    description: 'Токен доступа в формате: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
